<!-- 🔹 What is Class in HTML?
-> Class is used to apply the same CSS style
to multiple elements.

-> In CSS we use "." (dot) before class name.

Example:
.first_class { }


🔹 What is ID in HTML?
-> ID is used to apply CSS to a unique element.

-> In CSS we use "#" before ID name.

Example:
#second_class_id { } -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <style>
    h1 {
      background-color: red;
      color: whitesmoke;
    }

    p {
      background-color: black;
      color: whitesmoke;
      height: 200px;
      width: 400px;
      text-align: center;
      border: 5px solid yellow;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
      /* background-color: yellowgreen; */
    }

    .first_class {
      color: maroon;
      background-color: yellowgreen;
    }

    #second_class_id {
      color: whitesmoke;
      background-color: burlywood;
    }
  </style>

  <body>
    <center><h1>What is class and id in HTML</h1></center>


    <p class="first_class">This is our first surprise box</p>

    <p id="second_class_id">This is our second surprise box</p>
    <p>This is our third surprise box</p>
    <p>This is our fourth surprise box</p>
  </body>
</html>

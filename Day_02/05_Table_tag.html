<!doctype html>
<html lang="en">
  <head>

  <body>

    <table border="Black">

        <b>Student Name</b>
      </caption>
      <thead>

          <th>Name</th>

          <th>Course</th>
        </tr>

      <tbody>
        <tr>
          <td>Gulam</td>

          <td>B.Tech</td>
        </tr>
        <tr>
          <td>Vivek</td>
          <td>21</td>
          <td>BCA</td>
        </tr>
        <tr>
          <td>Ankit</td>
          <td>20</td>
          <td>B.Tech</td>
        </tr>
        <tr>
          <td>Neha</td>
          <td>20</td>
          <td>BCA</td>
        </tr>
      </tbody>
    </table>

    <!-- <table>:- Create a table
         <tr>:- Create a row
         <th>:- Difine a table heading
         <td>:- Difine a table data -->
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS</title>
</head>
<body>
    <!-- Inline CSS:- In this case we have to write CSS code in those specific HTML tags. -->

     <!-- Example 1 -->

    <h1 style="color: brown; background-color: aqua;">my name is gulam</h1>

    <!-- Example 2 -->
    <p style="color: black; background-color: yellow; font-size: 20px;">My full name is Gulam Rabbani</p>
    
</body>
</html>
